hata:`<h3>Doğruluk ve hassasiyet</h3><p><b>Doğruluk (accuracy):</b> sonucun gerçek değere yakınlığı. <b>Hassasiyet (precision):</b> tekrarlı hesapların birbirine yakınlığı, ya da sayının kaç basamakla verildiği. Hedef tahtası: oklar birbirine yakın ama merkezden uzaksa hassas ama doğru değil.</p><h3>Hata türleri</h3><span class="f">Mutlak hata   Eₜ = |gerçek − yaklaşık|
Bağıl hata    εᵣ = Eₜ / |gerçek|   (×100 ile yüzde)</span><h3>Anlamlı basamak</h3><p>Soldan ilk sıfırdan farklı rakamdan başlayıp güvenilir rakamların sayısıdır. <code>0.00314</code> → 3, <code>3.140</code> → 4, <code>3100</code> → belirsiz (bilimsel yazım gerekir).</p><span class="f">n anlamlı basamak için durdurma ölçütü:
εₛ = (0.5 × 10^(2−n)) %    →  |εₐ| < εₛ ise dur</span><p><b>Örnek:</b> π ≈ 3.14159 yerine 3.14: Eₜ ≈ 0.00159, εᵣ ≈ 0.000507 = %0.0507.</p>`,
extra:`<h3>İnterpolasyon ve ekstrapolasyon</h3><p>İnterpolasyon veri aralığının <b>içinde</b>, ekstrapolasyon <b>dışında</b> tahmin yapar. Aynı polinom kullanılabilir ama aralık dışında hata hızla büyür, bu yüzden ekstrapolasyon daha risklidir.</p><h3>Richardson ekstrapolasyonu</h3><p>Aynı yöntemi h ve h/2 ile uygula. Hata O(h<sup>p</sup>) ise:</p><span class="f">R = ( 2^p · D(h/2) − D(h) ) / ( 2^p − 1 )
Merkezi fark (p=2):  R = (4·D(h/2) − D(h)) / 3
Yamuk → Simpson:      (4·T(h/2) − T(h)) / 3     (Romberg'in ilk adımı)</span><p><b>Örnek:</b> f=eˣ, x=0, merkezi fark. D(0.2)=1.00668, D(0.1)=1.00167. R=(4·1.00167−1.00668)/3=<b>1.00000</b> (gerçek değer 1).</p>`,
turev:`<h3>Formüller</h3><span class="f">İleri:    (f(x+h) − f(x)) / h          hata O(h)
Geri:     (f(x) − f(x−h)) / h          hata O(h)
Merkezi:  (f(x+h) − f(x−h)) / 2h       hata O(h²)
f''(x) ≈  (f(x+h) − 2f(x) + f(x−h)) / h²   hata O(h²)
5 nokta:  (−f(x+2h)+8f(x+h)−8f(x−h)+f(x−2h)) / 12h   hata O(h⁴)</span><h3>Adım büyüklüğü h'nin etkisi</h3><ul><li><b>Kesme hatası</b> h ile küçülür (h², h⁴ ...).</li><li><b>Yuvarlama hatası</b> yaklaşık ε/h gibi büyür, çünkü birbirine çok yakın iki sayıyı çıkarırsın.</li><li>Toplam hatanın bir <b>en iyi h</b> değeri vardır. h'yi çok küçültmek sonucu kötüleştirir. Aşırı örnek: h=10⁻¹⁶ ile (eˣ)'in türevi 0 çıkar, çünkü f(x+h)=f(x) olur.</li></ul><p><b>Pratik kural:</b> h'yi yarıya böl, sonuç değişmiyorsa dur. Hata tahmini |D(h) − D(h/2)|. İyileştirmek için Richardson kullan (2. hafta notu).</p>`,
nc:`<h3>Kapalı formüller (uç noktalar dahil)</h3><span class="f">n=1 Yamuk:       (h/2)(f₀+f₁)
n=2 Simpson 1/3: (h/3)(f₀+4f₁+f₂)
n=3 Simpson 3/8: (3h/8)(f₀+3f₁+3f₂+f₃)
n=4 Boole:       (2h/45)(7f₀+32f₁+12f₂+32f₃+7f₄)</span><h3>Açık formüller (uç noktalar kullanılmaz)</h3><p><code>h = (b−a)/(n+2)</code>, düğümler <code>xᵢ = a+(i+1)h</code>, i=0..n.</p><span class="f">n=0 (orta nokta): 2h·f₀
n=1:              (3h/2)(f₀+f₁)
n=2 (Milne):      (4h/3)(2f₀ − f₁ + 2f₂)
n=3:              (5h/24)(11f₀ + f₁ + f₂ + 11f₃)</span><p>Açık formüller integral uçlarında f tanımsızsa işe yarar. Genelde kapalılardan daha az doğrudur. Yüksek n'de negatif ağırlıklar çıkar, bu yüzden pratikte <b>birleşik</b> (composite) kurallar kullanılır.</p><h3>Birleşik kurallar</h3><span class="f">Yamuk:       (h/2)[f₀ + 2(f₁+…+fₙ₋₁) + fₙ]
Simpson 1/3: (h/3)[f₀ + 4(tek) + 2(çift) + fₙ]    n çift olmalı</span><p><b>Hata derecesi:</b> yamuk O(h²), Simpson O(h⁴).</p><p><b>Örnek:</b> ∫₀¹x²dx, Simpson 1/3, h=0.5: (0.5/3)(0+4·0.25+1) = <b>1/3</b> (tam).</p>`,
gauss:`<h3>Legendre polinomları ([−1,1] üzerinde ortogonal)</h3><span class="f">P₀=1   P₁=x   P₂=(3x²−1)/2   P₃=(5x³−3x)/2</span><h3>Gauss-Legendre kuadratürü</h3><p>n noktalı formülün düğümleri Pₙ'nin kökleridir. Derecesi 2n−1'e kadar olan polinomları <b>tam</b> integre eder.</p><span class="f">∫₋₁¹ f(t)dt ≈ Σ wᵢ f(tᵢ)

n=2:  t = ±1/√3 (±0.57735)             w = 1, 1
n=3:  t = 0, ±√(3/5) (±0.77460)        w = 8/9, 5/9, 5/9</span><h3>[a,b] aralığına dönüşüm</h3><span class="f">x = (b−a)/2 · t + (a+b)/2        dx = (b−a)/2 dt
∫ₐᵇ f(x)dx = (b−a)/2 · Σ wᵢ f(x(tᵢ))</span><p><b>Örnek:</b> ∫₁³x²dx, n=2. (b−a)/2=1, x=t+2 → x=2.57735 ve 1.42265. f toplamı 6.64273+2.02394=<b>8.66667</b> = 26/3 (tam, çünkü derece ≤ 3).</p>`,
power:`<h3>Kuvvet (power) yöntemi</h3><p>Mutlak değerce <b>en büyük</b> özdeğeri ve özvektörünü bulur.</p><ol><li>Başlangıç x⁰ seç (ör. [1,1,…]).</li><li>y = A·xᵏ hesapla.</li><li>λ ≈ y'nin mutlak en büyük bileşeni. xᵏ⁺¹ = y/λ (normalize).</li><li>λ yakınsayana kadar tekrarla.</li></ol><p><b>Örnek:</b> A=[[2,1],[1,2]], x⁰=[1,0]. y=[2,1] → λ=2, x=[1,0.5]. y=[2.5,2] → λ=2.5, x=[1,0.8]. y=[2.8,2.6] → λ=2.8 ... λ→<b>3</b>, v→[1,1] (diğer özdeğer 1).</p><h3>Notlar</h3><ul><li>Yakınsama hızı |λ₂/λ₁|. İki büyük özdeğer birbirine yakınsa yavaş.</li><li>En küçük özdeğer: A⁻¹'e uygula (ters kuvvet yöntemi).</li><li>Belirli bir μ'ye en yakın özdeğer: (A−μI)⁻¹ ile uygula (kaydırmalı).</li><li>Hepsini bulmak için QR iterasyonu kullanılır. Hocanın hangisini işlediğine ders notundan bak.</li></ul>`,
smooth:`<h3>Neden pürüzsüzleştirme?</h3><p>Deneysel veride gürültü var. İnterpolasyon gürültüyü de aynen geçirir, regresyon ve pürüzsüzleştirme ise süzer.</p><h3>Yöntemler</h3><span class="f">3 nokta hareketli ortalama:  yᵢ' = (yᵢ₋₁ + yᵢ + yᵢ₊₁) / 3
Ağırlıklı:                    yᵢ' = (yᵢ₋₁ + 2yᵢ + yᵢ₊₁) / 4
5 nokta, 2. derece yerel polinom (Savitzky–Golay):
                              yᵢ' = (−3yᵢ₋₂ + 12yᵢ₋₁ + 17yᵢ + 12yᵢ₊₁ − 3yᵢ₊₂) / 35</span><p>Uçlarda pencere eksik kalır, o noktalar ya atlanır ya da tek taraflı formül kullanılır. Alternatif: düşük dereceli polinom regresyonu (en küçük kareler).</p><h3>Korelasyon</h3><span class="f">r = (nΣxy − ΣxΣy) / √[(nΣx² − (Σx)²)(nΣy² − (Σy)²)]    −1 ≤ r ≤ 1</span><p>|r|→1 güçlü doğrusal ilişki, r≈0 doğrusal ilişki yok. R² = r² regresyonun varyansı açıklama oranıdır. Korelasyon nedensellik göstermez.</p>`,
hermite:`<h3>Hermite interpolasyonu</h3><p>Hem <b>değeri</b> hem <b>türevi</b> uyduran polinom: P(xᵢ)=f(xᵢ), P'(xᵢ)=f'(xᵢ). n+1 nokta → derece ≤ 2n+1.</p><h3>Yöntem 1: Katsayı yöntemi</h3><p>İki nokta, 4 koşul → P=ax³+bx²+cx+d, koşulları yaz, çöz.</p><p><b>Örnek:</b> f(0)=1, f'(0)=0, f(1)=0, f'(1)=−2. d=1, c=0, a+b=−1, 3a+2b=−2 → a=0, b=−1. <code>P(x)=1−x²</code>.</p><h3>Yöntem 2: Bölünmüş farklar (her nokta iki kez)</h3><span class="f">z₀=z₁=x₀,  z₂=z₃=x₁    f[zᵢ,zᵢ₊₁]=f'(xᵢ) (aynı nokta olunca)
H(x)=f₀ + f'₀(x−x₀) + f[z₀,z₁,z₂](x−x₀)² + f[z₀..z₃](x−x₀)²(x−x₁)</span><p>Aynı örnek: f[z₁,z₂]=−1, f[z₀,z₁,z₂]=−1, f[z₁,z₂,z₃]=−1, f[z₀..z₃]=0 → H=1−x² ✓.</p><h3>Hata</h3><span class="f">f(x) − H(x) = f⁽²ⁿ⁺²⁾(ξ)/(2n+2)! · Π(x−xᵢ)²</span><p>Programdaki "tiriz eğrileri" muhtemelen <b>spline</b> demek. Aşağıdaki spline videolarını izle.</p>`
};
const flat=[];W.forEach((w,wi)=>w[1].forEach(it=>flat.push({wi,n:it[0],id:it[1]})));
let cur=0,done={};
try{done=JSON.parse(localStorage.getItem('m202d')||'{}');cur=Math.min(+(localStorage.getItem('m202c')||0),flat.length-1)}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('m202d',JSON.stringify(done));localStorage.setItem('m202c',cur)}catch(e){}}
function go(i){cur=Math.max(0,Math.min(flat.length-1,i));save();draw()}
function draw(){
 const v=flat[cur],w=W[v.wi],note=v.id[0]==='#';
 let h='<h2>'+v.n+'</h2><p class="sub">'+w[0]+' · '+(cur+1)+'/'+flat.length+'</p>';
 if(note)h+='<div class="note">'+N[v.id.slice(1)]+'</div>';
 else h+='<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+v.id+'?rel=0&modestbranding=1&playsinline=1" title="'+v.n+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div>';
 h+='<div class="ctl"><button id="pv">Önceki</button><button class="p" id="nx">'+(done[v.id+v.n]?'Sonraki':'Bitti, sonrakine geç')+'</button>';
 if(!note)h+='<a class="lnk" target="yt" rel="noopener" href="https://youtu.be/'+v.id+'">YouTube\'da aç</a>';
 const q=w[1].filter(t=>t[1][0]!=='#').map(t=>t[1]).slice(0,50).join(',');
 h+='<a class="lnk" target="yt" rel="noopener" href="https://www.youtube.com/watch_videos?video_ids='+q+'">Bu haftanın tüm videolarını sırayla oynat</a>';
 $('m').innerHTML=h+'</div>';
 $('pv').onclick=()=>go(cur-1);
 $('nx').onclick=()=>{done[v.id+v.n]=1;go(cur+1)};
 let s='',k=0;
 W.forEach((x,wi)=>{const nd=x[1].filter(t=>done[t[1]+t[0]]).length;
  s+='<details'+(wi===v.wi?' open':'')+'><summary>'+x[0]+' <small>('+nd+'/'+x[1].length+')</small></summary>';
  x[1].forEach(t=>{s+='<button class="it'+(k===cur?' on':'')+'" data-k="'+k+'"><span class="c">'+(done[t[1]+t[0]]?'✓':'')+'</span>'+t[0]+'</button>';k++});
  s+='</details>'});
 $('s').innerHTML=s;
 $('s').querySelectorAll('.it').forEach(b=>b.onclick=()=>go(+b.dataset.k));
 const nd=Object.keys(done).length;
 $('pg').textContent=nd+' / '+flat.length+' tamamlandı';$('bi').style.width=(100*nd/flat.length)+'%';
}
const nm=t=>t.toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
flat.forEach(f=>f.t=nm(f.n+' '+W[f.wi][0]+' '+(f.id[0]==='#'?(N[f.id.slice(1)]||'').replace(/<[^>]*>/g,' '):'')));
let sr=[],hl=0;const q=$('q'),sl=$('sl');
function sc(){sl.classList.remove('on');hl=0}
function sh(){sl.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('h',i===hl));const d=sl.children[hl];if(d&&d.scrollIntoView)d.scrollIntoView({block:'nearest'})}
function sf(){const w=nm(q.value).split(/\s+/).filter(Boolean);if(!w.length){sc();return}
 sr=[];for(let k=0;k<flat.length&&sr.length<10;k++)if(w.every(x=>flat[k].t.includes(x)))sr.push(k);
 hl=0;sl.innerHTML=sr.length?sr.map(k=>'<div data-k="'+k+'">'+flat[k].n+'<small>'+W[flat[k].wi][0]+'</small></div>').join(''):'<div class="e">Sonuç yok</div>';
 sl.classList.add('on');sh()}
function sp(k){q.value='';sc();q.blur();go(k)}
q.oninput=sf;q.onfocus=()=>{if(q.value)sf()};
q.onkeydown=e=>{if(e.key==='Escape')sc();else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(sr.length&&sl.classList.contains('on')){hl=(hl+(e.key==='ArrowDown'?1:sr.length-1))%sr.length;sh()}}else if(e.key==='Enter'&&sl.classList.contains('on')&&sr.length)sp(sr[hl])};
sl.onclick=e=>{const d=e.target.closest('div[data-k]');if(d)sp(+d.dataset.k)};
document.addEventListener('click',e=>{if(!e.target.closest('.sr'))sc()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='IFRAME'||e.target.tagName==='INPUT')return;if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();q.focus();return}if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
draw();
</script></body></html>
